name: Paper (PDF, EN + FR)

on:
  push:
    branches: [main]
    paths:
      - "paper/**"
      - ".github/workflows/paper.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build EN paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: balade.en.tex
          args: -pdf -interaction=nonstopmode
      - name: Build FR paper
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: balade.fr.tex
          args: -pdf -interaction=nonstopmode
      - name: Upload PDFs
        uses: actions/upload-artifact@v4
        with:
          name: balade-paper
          path: |
            paper/balade.en.pdf
            paper/balade.fr.pdf
          retention-days: 30

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: balade-paper
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            balade.en.pdf
            balade.fr.pdf
