<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="opt_title">Balade</title>
<link rel="stylesheet" href="options.css">
</head>
<body>
  <main class="page">
    <header class="top">
      <span class="logo" aria-hidden="true">
        <svg width="34" height="34" viewBox="0 0 24 24"><path d="M4 2.5 L4 18 L7.6 14.6 L10.2 20.1 L12.8 18.9 L10.3 13.6 L15 13.5 Z" fill="#fff" stroke="#1B1D21" stroke-width="1.2" stroke-linejoin="round"/></svg>
      </span>
      <div>
        <h1 data-i18n="opt_h1"></h1>
        <p class="sub" data-i18n="opt_sub"></p>
      </div>
      <p class="saved" id="saved" aria-live="polite"></p>
    </header>

    <section class="card" aria-labelledby="t-names">
      <h2 id="t-names" data-i18n="opt_names"></h2>
      <p class="hint" data-i18n="opt_names_hint"></p>
      <label class="sr-only" for="names" data-i18n="opt_names_label"></label>
      <textarea id="names" rows="8" spellcheck="false" placeholder="Alix&#10;Bastien&#10;Chloé"></textarea>
      <div class="row">
        <span class="hint" id="namesCount"></span>
        <button type="button" class="ghost-btn" id="namesReset" data-i18n="opt_names_reset"></button>
      </div>
    </section>

    <section class="card" aria-labelledby="t-theme">
      <div class="row">
        <h2 id="t-theme" data-i18n="opt_theme"></h2>
        <label class="switch"><span data-i18n="opt_theme_use"></span><input type="checkbox" id="customOn"></label>
      </div>
      <p class="hint" data-i18n="opt_theme_hint"></p>

      <h3 data-i18n="opt_base"></h3>
      <div class="bases" id="bases" role="radiogroup" data-i18n-attr="aria-label: opt_base"></div>

      <h3 data-i18n="opt_colors"></h3>
      <div class="palette" id="palette"></div>
      <div class="row">
        <button type="button" class="ghost-btn" id="addColor" data-i18n="opt_color_add"></button>
        <button type="button" class="ghost-btn" id="resetColors" data-i18n="opt_color_reset"></button>
      </div>

      <h3 data-i18n="opt_pointer"></h3>
      <div class="pointer">
        <div class="drop">
          <label class="file-btn"><span data-i18n="opt_import"></span><input type="file" id="svgFile" accept=".svg,image/svg+xml"></label>
          <p class="hint" data-i18n-html="opt_import_hint"></p>
          <p class="error" id="svgError" role="alert"></p>
          <button type="button" class="ghost-btn" id="svgRemove" hidden data-i18n="opt_pointer_remove"></button>
        </div>
        <figure class="stage-box" id="hotBox" hidden>
          <div class="checker" id="hotArea" role="button" tabindex="0" data-i18n-attr="aria-label: opt_hot_label">
            <svg id="hotSvg" width="160" height="160"></svg>
            <span class="hot" id="hotMark" aria-hidden="true"></span>
          </div>
          <figcaption class="hint" data-i18n="opt_hot_hint"></figcaption>
        </figure>
      </div>

      <h3 data-i18n="opt_preview"></h3>
      <div class="preview" id="preview"></div>
    </section>

    <footer class="foot hint" data-i18n="opt_foot"></footer>
  </main>

  <script src="../src/core/namespace.js"></script>
  <script src="../src/core/I18n.js"></script>
  <script src="../src/core/Settings.js"></script>
  <script src="../src/core/SvgSanitizer.js"></script>
  <script src="../src/render/Themes.js"></script>
  <script src="options.js"></script>
</body>
</html>
